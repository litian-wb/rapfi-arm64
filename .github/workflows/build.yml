name: build-rapfi

# 目标：在 GitHub 的免费 ARM64 跑机器人上，把 Rapfi 编成
#       musl aarch64 二进制，拷回手机直接运行。
# 关键点：musl 的默认线程栈只有 128KB（glibc 是 8MB），Rapfi 的搜索递归
#         会立刻爆栈段错误。所以用 --wrap=pthread_create 给所有线程
#         换成 32MB 栈。

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    # 注意：ubuntu-24.04-arm 只对【公开仓库】免费。私有仓库请改成 ubuntu-latest。
    runs-on: ubuntu-24.04-arm
    container: alpine:3.20

    steps:
      - name: 安装工具链
        run: apk add --no-cache build-base cmake ninja git file curl jq

      - name: 拉取 Rapfi 源码
        run: git clone --depth 1 https://github.com/dhbloo/rapfi.git /src

      - name: 编译线程栈补丁
        run: |
          cat > /src/pthread_stack.c <<'CEOF'
          #include <pthread.h>
          #include <stddef.h>

          #define WANT_STACK (8u * 1024u * 1024u)

          extern int __real_pthread_create(pthread_t *, const pthread_attr_t *,
                                           void *(*)(void *), void *);

          int __wrap_pthread_create(pthread_t *th, const pthread_attr_t *attr,
                                    void *(*fn)(void *), void *arg)
          {
              pthread_attr_t a;
              if (attr) {
                  a = *attr;
              } else {
                  pthread_attr_init(&a);
              }
              size_t sz = 0;
              if (pthread_attr_getstacksize(&a, &sz) != 0 || sz < WANT_STACK) {
                  pthread_attr_setstacksize(&a, WANT_STACK);
              }
              return __real_pthread_create(th, &a, fn, arg);
          }
          CEOF
          gcc -O2 -c /src/pthread_stack.c -o /src/pthread_stack.o
          file /src/pthread_stack.o

      - name: 配置
        run: |
          cd /src/Rapfi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_NEON=ON \
            -DUSE_NEON_DOTPROD=OFF \
            -DCMAKE_EXE_LINKER_FLAGS="-static -Wl,--wrap=pthread_create /src/pthread_stack.o"
          echo "--- 关键开关 ---"
          grep -E "USE_NEON|NO_MULTI_THREADING" build/CMakeCache.txt || true

      - name: 编译
        run: cmake --build /src/Rapfi/build -j"$(nproc)"

      - name: 检查产物
        run: |
          cd /src/Rapfi/build
          BIN="$(find . -maxdepth 1 -type f -executable | head -1)"
          echo "产物路径: $BIN"
          ls -la "$BIN"
          file "$BIN"
          echo "--- 确认补丁已链入（应能找到 __wrap_pthread_create）---"
          (nm "$BIN" 2>/dev/null | grep -c "pthread_create" || echo "nm 不可用")
          if readelf -d "$BIN" | grep -q NEEDED; then
            readelf -d "$BIN" | grep NEEDED
          else
            echo "无动态依赖 ✅ 完全静态"
          fi
          cp "$BIN" /src/pbrain-rapfi
          chmod 755 /src/pbrain-rapfi

      - name: 发布到 Release
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: build-${{ github.run_number }}
        run: |
          REPO="${{ github.repository }}"
          echo "→ 创建 release $TAG"
          REL="$(curl -sS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"Rapfi aarch64 $TAG\"}" \
            "https://api.github.com/repos/$REPO/releases")"
          ID="$(echo "$REL" | jq -r '.id')"
          URL="$(echo "$REL" | jq -r '.upload_url' | cut -d'{' -f1)"
          if [ "$ID" = "null" ] || [ -z "$ID" ]; then echo "$REL"; exit 1; fi
          echo "release id = $ID"
          curl -sS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @/src/pbrain-rapfi \
            "$URL?name=pbrain-rapfi" | jq -r '"下载地址: " + .browser_download_url'
